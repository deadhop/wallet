[package]
name = "deadhop-wallet"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "deadhop's sweeping wallet: holds the funds and moves them out past a threshold (simple send, PayJoin or CoinJoin)"
license = "MIT"
publish = false

[dependencies]
# The shared crates of the payment service (not the service itself, so no
# database or MCP server is linked in), from deadhop/server. Cargo.lock pins
# the commit; move to a newer one with
#   cargo update -p deadhop-common -p deadhop-electrum -p deadhop-net -p deadhop-tlspin
deadhop-common = { git = "https://github.com/deadhop/server", branch = "main" }
deadhop-electrum = { git = "https://github.com/deadhop/server", branch = "main" }
deadhop-net = { git = "https://github.com/deadhop/server", branch = "main", default-features = false }
deadhop-tlspin = { git = "https://github.com/deadhop/server", branch = "main" }
async-trait = "0.1"
bip39 = { version = "2", default-features = false, features = ["std"] }
bitcoin = { version = "0.32", default-features = false, features = ["std", "base64", "rand-std"] }
getrandom = "0.2"
hex = "0.4"
nostr-sdk = { version = "0.44", features = ["nip04"] }
payjoin = { version = "1.3", default-features = false, features = ["v1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
